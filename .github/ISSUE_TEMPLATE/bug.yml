name: "버그 보고"
description: "10월 MVP 버그의 재현 조건과 기대·실제 동작, 영향과 해결 확인 기준을 남깁니다."
labels: ["mvp-october"]
body:
  - type: markdown
    attributes:
      value: "30분 이상 해결하지 못한 버그는 기존 이슈를 확인해 작성·갱신하고 Slack으로 도움을 요청합니다. 비밀번호·토큰·개인 자료 원문은 첨부하지 않습니다."
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차와 환경
      description: "버전·환경·조건·단계. 재현되지 않으면 관찰한 사실과 미확인 부분을 구분합니다."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 기대 동작과 실제 동작
      description: "어떤 동작을 기대했으며 실제로 무엇이 발생했는가? 기대 동작의 근거가 되는 이슈 완료 기준·승인된 제품 행동·합의된 계약을 관련 근거 칸에 연결합니다. 미확정이면 그대로 표시합니다."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향과 시도한 해결
      description: "영향받는 흐름, 자료·권한 영향, 확인한 증거와 시도 결과."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 해결 완료 기준
      description: "재현 사례와 필요한 회귀 검증 조건을 적습니다."
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 관련 작업과 근거
      description: "관련 이슈·PR·요구사항·설계 링크. 미확정이면 그대로 표시합니다."
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: 선행 조건과 담당 제안
      description: "막힌 이유·필요한 조치·담당/검토 상대·영역·우선순위 제안. 미정이면 미정."
    validations:
      required: true
