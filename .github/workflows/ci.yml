# dev 대상 PR의 최소 CI(#201). 각 서비스 README의 기존 검사 명령을 그대로 실행한다.
# 11월 개발 통합 브랜치(intent/260925-intent-12, 레포 컨벤션 §2.1)에 들어가는 PR·Unit 합치기·dev 가져오기에도 같은 검사를 돌린다(#389).
# 서비스 job은 관련 경로가 바뀐 경우에만 돌고, 아니면 건너뛴다. 건너뛴 job은 필수 상태 검사에서 통과로 취급된다.
# 필수 상태 검사로 거는 job 이름(changes·web·api·worker·deps-audit)을 바꾸면 dev ruleset도 함께 고친다.
# Actions는 job마다 1분 단위로 올려 과금하므로, 몇 초면 끝나는 검사는 job을 따로 두지 않고 changes의 단계로 붙인다.
# 외부 action은 전체 커밋 SHA로 고정하고 판본을 주석으로 남긴다(#215). 갱신 PR은 Dependabot이 주 1회 올린다(.github/dependabot.yml).
# checkout 뒤에 git 인증을 쓰는 job이 없으므로, 토큰을 작업 폴더(.git/config)에 남기지 않는다(persist-credentials: false).
name: CI

on:
  pull_request:
    branches: [dev, 'intent/**']
  push:
    branches: [dev, 'intent/**']
  workflow_dispatch: # 수동 실행은 경로와 관계없이 모든 서비스를 검사한다.

permissions:
  contents: read

# 같은 PR에 새 push가 오면 이전 실행을 취소한다. 브랜치 push와 수동 실행은 실행마다 따로 돈다.
# 커밋으로 묶으면 같은 커밋이 dev와 통합 브랜치에 올라올 때 뒤 실행이 앞 실행을 기다리고, 셋이 겹치면 대기 중인 실행이 취소된다.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.detect.outputs.web }}
      api: ${{ steps.detect.outputs.api }}
      worker: ${{ steps.detect.outputs.worker }}
      deps: ${{ steps.detect.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # push는 push 직전 커밋과 비교하므로 이력 전체를 받는다(약 17MB, 커밋 2개만 받을 때보다 1초 안쪽 더 걸린다).
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # PR은 GitHub이 만든 시험 병합 커밋이라 첫 부모(대상 브랜치)와 비교하면 그 PR의 변경 전체가 나온다.
          # push는 push 직전 커밋과 비교한다. 통합 브랜치에 Unit 여러 개를 합친 뒤 한 번에 올려도 바뀐 서비스를 모두 잡는다.
          # 브랜치를 처음 만든 push(직전 커밋이 0)나 직전 커밋을 이력에서 찾지 못하면 모든 서비스를 검사한다.
          contract=api/contracts/repository-analysis/
          web=false api=false worker=false deps=''
          base=HEAD^1
          case "$EVENT" in push) base=$BEFORE ;; esac
          if [ "$EVENT" = workflow_dispatch ] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            web=true api=true worker=true deps='web api worker'
          else
            files=$(git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD)
            while IFS= read -r file; do
              case "$file" in .github/workflows/ci.yml) web=true api=true worker=true ;; esac
              case "$file" in web/*) web=true ;; esac
              # api 테스트는 worker 합성 자료와 계약 YAML도 읽고, web 통합 시험(공유 링크 #149·화면 통합 #123)은 web의 기능·lib 코드를 직접 불러온다.
              # 큐 판본 시험은 api의 BullMQ·ioredis가 큐 검증 키트에 고정한 판본과 같은지 본다.
              case "$file" in api/* | worker/fixtures/* | "$contract"* | web/src/features/share-links/* | web/src/features/assets/* | web/src/features/recipient/* | web/src/features/repository-management/* | web/src/lib/* | docs/queue-verification/package.json | docs/queue-verification/package-lock.json) api=true ;; esac
              # U7의 API 연결 시험은 worker 제품 코드·시험 도우미를 Python으로 직접 실행한다.
              # 실행 코드나 Python 환경이 바뀌어도 API 쪽 연결 검사를 건너뛰지 않는다(#389).
              case "$file" in worker/app/* | worker/tests/* | worker/.python-version | worker/pyproject.toml | worker/uv.lock) api=true ;; esac
              # worker 메시지 검사는 계약 YAML을 읽고, ruff는 루트 .gitignore에 적힌 파일을 검사에서 뺀다.
              # 큐 소비자 시험은 큐 검증 키트의 판본(BullMQ·redis)과 같은지 보고 키트의 Node BullMQ로 요청을 넣는다.
              case "$file" in worker/* | "$contract"* | .gitignore | docs/queue-verification/pyproject.toml | docs/queue-verification/uv.lock | docs/queue-verification/package.json | docs/queue-verification/package-lock.json) worker=true ;; esac
            done <<< "$files"
            # 의존성 취약점 검사는 의존성 목록·잠금 파일이 바뀐 서비스만 한다. 검사 방법(CI·스크립트·예외 목록)이 바뀌면 전부 한다.
            for s in web api worker; do
              if grep -qxE "$s/(package\.json|package-lock\.json|pyproject\.toml|uv\.lock)|\.github/(workflows/ci\.yml|scripts/check-deps-audit\.sh|deps-audit-exceptions\.txt)" <<< "$files"; then
                deps="${deps:+$deps }$s"
              fi
            done
          fi
          printf 'web=%s\napi=%s\nworker=%s\ndeps=%s\n' "$web" "$api" "$worker" "$deps" | tee -a "$GITHUB_OUTPUT"
          printf '### 실행할 서비스 검사\n\n| web | api | worker |\n|---|---|---|\n| %s | %s | %s |\n\n의존성 취약점 검사: %s\n' \
            "$web" "$api" "$worker" "${deps:-없음}" >> "$GITHUB_STEP_SUMMARY"
      - name: ci-changes-regression
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test-ci-changes.py
      # 문서 크기 검사는 앞 단계가 실패해도 돈다. 이 단계가 실패하면 changes가 실패해 머지를 막고,
      # 서비스 job은 !cancelled() 조건이라 detect 결과대로 그대로 돈다(job 출력은 job이 끝날 때 계산된다).
      - name: docs-size
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-doc-sizes.sh

  web:
    name: web
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # lint → typecheck → test → build → check:run(next start로 GET / 확인)
      - run: npm run check

  api:
    name: api
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    env:
      # 러너 기본값 UTC에서는 timestamptz 테스트의 '현지 시각 ≠ UTC' 경우가 빠지므로 팀 로컬과 같은 시간대로 둔다.
      TZ: Asia/Seoul
      # 이 값이 있으면 큐 연결(#233)의 실제 Valkey 시험이 건너뛰지 않고 반드시 돈다(api/docs/analysis-queue.md 「시험」).
      CATCHU_TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      # worker job과 같은 Valkey 8.1.6(큐 검증 키트가 돌린 판본). digest로 고정한다.
      valkey:
        image: valkey/valkey:8.1.6-alpine@sha256:1cb6b20b70d927560cc4cc5397b5f045e74aa603ff7696274778880bb6fadc75
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # api README 「DB 테스트」의 docker run과 같은 값이다. 테스트 실행기의 기본 TEST_DB_*와 맞으므로 따로 넘기지 않는다.
      # 이미지는 pgvector가 든 PostgreSQL 16으로, 로컬 합성 DB(deploy/compose.local-db.yaml)와 같은 digest로 고정한다(#389).
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
        env:
          POSTGRES_USER: catchu
          POSTGRES_PASSWORD: catchu_local
          POSTGRES_DB: catchu_test
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U catchu -d catchu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: api/package.json
          cache: npm
          cache-dependency-path: api/package-lock.json
      # U7 연결 시험이 실제 Python 함수를 호출하므로 API job에도 worker의 잠금 환경을 준비한다.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.18'
          checksum: '89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16'
          working-directory: worker
          cache-dependency-glob: uv.lock
      - run: uv python install
        working-directory: worker
      - run: uv sync --locked
        working-directory: worker
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # npm run test:analysis-fixtures와 같은 검사다. npm test가 방금 빌드한 dist를 쓰므로 빌드를 한 번 더 하지 않는다.
      - run: node --test test/analysis/shared-fixtures.check.cjs

  worker:
    name: worker
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      # 이 값이 있으면 큐 소비자의 실제 Redis 시험이 건너뛰지 않고 반드시 돈다(worker/docs/queue-consumer.md).
      CATCHU_TEST_REDIS_URL: redis://127.0.0.1:6379
      CATCHU_TEST_REQUIRE_NODE: '1'
    services:
      # 운영 큐(ElastiCache Valkey 8.1)와 같은 계열이자 큐 검증 키트가 돌린 Valkey 8.1.6. digest로 고정한다.
      valkey:
        image: valkey/valkey:8.1.6-alpine@sha256:1cb6b20b70d927560cc4cc5397b5f045e74aa603ff7696274778880bb6fadc75
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.18' # worker README 「도구와 버전」의 기준. 저장소 설정에는 uv 판본 고정이 없다.
          checksum: '89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16' # uv 0.12.18 x86_64-unknown-linux-gnu. version을 바꾸면 변경 불가 릴리스 자산의 sha256으로 함께 바꾼다.
          working-directory: worker
          cache-dependency-glob: uv.lock
      - run: uv python install # .python-version(3.12.10)
      - run: uv sync --locked
      # 큐 소비자 시험 14는 api(#233)가 쓸 Node BullMQ로 요청을 넣는다. 판본은 큐 검증 키트에 고정한 것을 쓴다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/queue-verification/package.json
          cache: npm
          cache-dependency-path: docs/queue-verification/package-lock.json
      - run: npm ci
        working-directory: docs/queue-verification
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest

  deps-audit:
    name: deps-audit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.deps != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 잠금 파일만 읽으므로 의존성은 설치하지 않는다. web·api의 Node 판본이 같아 web 기준 하나만 설치한다.
      - if: contains(needs.changes.outputs.deps, 'web') || contains(needs.changes.outputs.deps, 'api')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - if: contains(needs.changes.outputs.deps, 'worker')
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.18' # worker job과 같은 판본
          checksum: '89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16' # worker job과 같은 값
          enable-cache: false
      - env:
          SERVICES: ${{ needs.changes.outputs.deps }}
          GH_TOKEN: ${{ github.token }} # 예외 목록의 취약점에 고친 판본이 나왔는지 GitHub 취약점 DB에서 확인한다.
        run: bash .github/scripts/check-deps-audit.sh $SERVICES
