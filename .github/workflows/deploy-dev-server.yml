# 개발 서버 자동 배포(#313). main에 반영된 판본을 arm64로 빌드·검사해 ECR에 올리고 개발 서버(#304)에서 교체한다.
# 수동 실행(Run workflow)은 main에서만 되고, 커밋을 넣으면 그 main 커밋을 다시 배포한다(되돌리기). 이미 올린 판본이면 빌드·검사를 건너뛴다.
# 되돌릴 수 있는 커밋은 main의 first-parent 커밋(main에 반영된 판본)뿐이다. 반영된 PR 안의 중간 커밋은 승인된 최종 판본이 아니므로 받지 않는다.
# 배포 도구(deploy/dev-server/cd/)는 늘 그 실행의 main 판본을 쓰고, 이미지·compose·교체 스크립트만 배포할 커밋에서 가져온다.
# job은 셋이다. plan·deploy만 AWS 권한(OIDC)을 받고, 배포할 커밋의 코드를 러너에서 실행하는 이미지 검사(check)는 권한 없는 별도 러너에서 돈다.
# AWS 역할은 environment dev-server(배포 브랜치 main만)에서 돈 job만 믿으며, 저장소에 AWS 키를 두지 않는다.
# 배포는 한 번에 하나만 돈다. 진행 중에 main push가 여러 번 오면 기다리는 실행은 가장 나중 것 하나만 남는다.
# 절차·끄는 법·되돌리기는 deploy/dev-server/cd/README.md.
# 외부 action은 ci.yml과 같은 전체 커밋 SHA로 고정한다(#215). checkout 뒤 git 인증을 쓰지 않으므로 토큰을 남기지 않는다.
name: deploy-dev-server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 다시 배포할 main 커밋(40자리, main에 반영된 판본). 비우면 main 최신
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-dev-server
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment:
      name: dev-server
    permissions:
      contents: read
      id-token: write
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      tag: ${{ steps.target.outputs.tag }}
      tools: ${{ steps.src.outputs.tools }}
      build_apps: ${{ steps.plan.outputs.build_apps }}
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - name: 배포할 커밋 정하기
        id: target
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          DEV_SERVER_DOMAIN: ${{ vars.DEV_SERVER_DOMAIN }}
          DEV_SERVER_INSTANCE_ID: ${{ vars.DEV_SERVER_INSTANCE_ID }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::main에서만 배포한다(지금 ${REF})"; exit 1; }
          commit=${INPUT_COMMIT:-$SHA}
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::커밋은 40자리 소문자 16진수로 넣는다"; exit 1; }
          [[ "$DEV_SERVER_DOMAIN" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::environment 변수 DEV_SERVER_DOMAIN이 비었거나 형식이 틀렸다"; exit 1; }
          [[ "$DEV_SERVER_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || { echo "::error::environment 변수 DEV_SERVER_INSTANCE_ID가 비었거나 형식이 틀렸다"; exit 1; }
          [ -n "$ROLE_ARN" ] || { echo "::error::environment 변수 AWS_DEPLOY_ROLE_ARN이 비었다"; exit 1; }
          printf 'commit=%s\ntag=main-%s\n' "$commit" "${commit:0:12}" >> "$GITHUB_OUTPUT"
          printf '### 배포 대상\n\n- 커밋: `%s`\n- 이미지 태그: `main-%s`\n' "$commit" "${commit:0:12}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: main에 반영된 판본인지 확인
        id: src
        env:
          COMMIT: ${{ steps.target.outputs.commit }}
        run: bash deploy/dev-server/cd/ci-source.sh check

      - name: AWS 권한 받기
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: catchu-plan-${{ github.run_id }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: 이미 올린 판본인지 확인
        id: plan
        env:
          TAG: ${{ steps.target.outputs.tag }}
          TOOLS_COMMIT: ${{ steps.src.outputs.tools }}
        run: bash deploy/dev-server/cd/ci-images.sh plan

  # 배포할 커밋의 검사 스크립트를 실행하므로 AWS 권한·OIDC 토큰 요청 권한이 없는 별도 job(별도 러너)으로 둔다.
  check:
    name: check
    needs: plan
    if: needs.plan.outputs.build_apps == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: 검사 스크립트 확인
        run: |
          [ -f deploy/scripts/check-images.mjs ] && [ -f web/.node-version ] || { echo "::error::이 커밋에는 이미지 검사가 없어 배포할 수 없다"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      - name: 이미지 검사(arm64)
        run: node deploy/scripts/check-images.mjs

  deploy:
    name: deploy
    needs: [plan, check]
    # 검사가 필요 없어 건너뛴 경우(이미 올린 판본)에도 배포한다. 검사가 실패·취소되면 배포하지 않는다.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment:
      name: dev-server
      url: https://${{ vars.DEV_SERVER_DOMAIN }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      DEV_SERVER_DOMAIN: ${{ vars.DEV_SERVER_DOMAIN }}
      DEV_SERVER_INSTANCE_ID: ${{ vars.DEV_SERVER_INSTANCE_ID }}
    steps:
      # 작업 폴더는 plan과 같은 main 판본(배포 도구). 배포할 커밋은 따로 꺼낸다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.tools }}

      - name: 배포할 커밋 꺼내기
        id: src
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: bash deploy/dev-server/cd/ci-source.sh checkout

      - name: AWS 권한 받기
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: catchu-deploy-${{ github.run_id }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: 빌드·ECR 올리기
        id: images
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          TOOLS_COMMIT: ${{ needs.plan.outputs.tools }}
          SRC_DIR: ${{ steps.src.outputs.dir }}
        run: bash deploy/dev-server/cd/ci-images.sh push

      - name: 개발 서버 교체
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
          WEB_DIGEST: ${{ steps.images.outputs.web }}
          API_DIGEST: ${{ steps.images.outputs.api }}
          MIGRATION_DIGEST: ${{ steps.images.outputs.migration }}
          WORKER_DIGEST: ${{ steps.images.outputs.worker }}
          FILES_DIGEST: ${{ steps.images.outputs.files }}
        run: bash deploy/dev-server/cd/ci-deploy.sh

      - name: 바깥 확인
        run: bash deploy/dev-server/cd/ci-check.sh
