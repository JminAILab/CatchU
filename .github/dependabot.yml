# CI가 쓰는 외부 action의 고정 커밋(SHA)과 판본 주석을 갱신하는 PR을 주 1회, 한 PR로 묶어 올린다(#215).
# npm·uv 의존성의 판본 갱신은 여기서 켜지 않는다. 그 의존성은 저장소 설정의 Dependabot 보안 업데이트만 받는다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore # 레포 컨벤션의 커밋 접두사
    labels: [] # 기본 라벨(dependencies)을 새로 만들지 않는다.
