<text x="165.0" y="671.4" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">확인 완료</text>
<rect x="232" y="646" width="120" height="40" rx="3" fill="#ffffff" stroke="#666666" stroke-width="1"/>
<text x="292.0" y="671.4" font-size="15" font-weight="normal" fill="#111111" text-anchor="middle">불일치 표시</text>
<circle cx="220" cy="644" r="13" fill="#111111"/>
<text x="220" y="649" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>
<circle cx="352" cy="644" r="13" fill="#111111"/>
<text x="352" y="649" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">13</text>
<rect x="110" y="706" width="980" height="142" rx="0" fill="#fafafa" stroke="#999999" stroke-width="1" stroke-dasharray="5,4"/>
<text x="130" y="732" font-size="14" font-weight="bold" fill="#666666" text-anchor="start">확인 완료 뒤 같은 자리에 표시</text>
<text x="130" y="758" font-size="14" font-weight="normal" fill="#111111" text-anchor="start">현재는 미공개입니다. 확인 완료만으로 공개되지 않습니다.</text>
<text x="130" y="782" font-size="14" font-weight="normal" fill="#111111" text-anchor="start">공개하면 유효한 공유 링크에서 근거와 본인 기여, 설명을 열람할 수 있습니다.</text>
<rect x="130" y="798" width="100" height="38" rx="3" fill="#333333" stroke="#333333" stroke-width="1"/>
<text x="180.0" y="822.04" font-size="14" font-weight="normal" fill="#ffffff" text-anchor="middle">지금 공개</text>
