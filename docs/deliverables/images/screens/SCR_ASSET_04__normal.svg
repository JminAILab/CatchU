<text x="690" y="190" font-size="16" font-weight="bold" fill="#111111" text-anchor="start">원본 근거</text>
<text x="690" y="218" font-size="14" font-weight="bold" fill="#111111" text-anchor="start">PR #12 · 커밋 a1b2c3d</text>
<text x="690" y="244" font-size="14" font-weight="normal" fill="#111111" text-anchor="start">표현 사실: 빈 목록 응답을 빈 배열로 반환</text>
<text x="690" y="268" font-size="14" font-weight="normal" fill="#111111" text-anchor="start">기여 범위: 본인이 작성한 변경</text>
<text x="690" y="292" font-size="14" font-weight="normal" fill="#666666" text-anchor="start">한계: 관련 변경 부분만 확인했습니다.</text>
<rect x="690" y="318" width="150" height="38" rx="3" fill="#ffffff" stroke="#666666" stroke-width="1"/>
<text x="765.0" y="342.04" font-size="14" font-weight="normal" fill="#111111" text-anchor="middle">근거 원문 보기</text>
<circle cx="785" cy="182" r="13" fill="#111111"/>
<text x="785" y="187" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
<circle cx="840" cy="316" r="13" fill="#111111"/>
<text x="840" y="321" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
<rect x="670" y="395" width="440" height="180" rx="0" fill="#ffffff" stroke="#999999" stroke-width="1"/>
<text x="690" y="425" font-size="16" font-weight="bold" fill="#111111" text-anchor="start">생각해볼 질문</text>
<text x="690" y="449" font-size="14" font-weight="normal" fill="#666666" text-anchor="start">나의 경험을 되짚기 위한 질문</text>
<text x="690" y="481" font-size="14" font-weight="normal" fill="#111111" text-anchor="start">이 변경을 하기 전 어떤 동작을 확인했나요?</text>
<text x="690" y="511" font-size="14" font-weight="normal" fill="#111111" text-anchor="start">이 기록에서 직접 설명할 수 있는 나의 기여는</text>
<text x="690" y="533" font-size="14" font-weight="normal" fill="#111111" text-anchor="start">무엇인가요?</text>
<text x="690" y="563" font-size="14" font-weight="normal" fill="#666666" text-anchor="start">본인에게만 표시되며 답변을 저장하지 않습니다.</text>
<circle cx="820" cy="417" r="13" fill="#111111"/>
<text x="820" y="422" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
<rect x="90" y="595" width="1020" height="270" rx="0" fill="#ffffff" stroke="#999999" stroke-width="1"/>
<text x="110" y="628" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">근거와 본인 기여를 확인한 뒤 선택해 주세요. 설명 문구는 직접 수정할 수 없습니다.</text>
<circle cx="700" cy="620" r="13" fill="#111111"/>
<text x="700" y="625" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">11</text>
