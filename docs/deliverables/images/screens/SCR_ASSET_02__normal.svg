<text x="64" y="464" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">· 포트폴리오·자기소개서·이력서 세 탭은 모두 같은 준비 중 안내만 보인다. 업로드·목록·저장 기능은 없다(9/24 결정).</text>
<text x="64" y="492" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">· 저장소 연결 관리 영역과 Catch 목록은 Catch 탭에만 있다. 안내 문구는 v2.2 검토초안의 문구를 따른 제안이다.</text>
<text x="64" y="520" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">· 12월 계획판에서는 자기소개서·포트폴리오·이력서 탭(SCR_ASSET_54~56, 미승인 계획)으로 대체한다.</text>
