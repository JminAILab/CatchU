<text x="30" y="622" font-size="15" font-weight="bold" fill="#555555" text-anchor="start">설계 메모</text>
<text x="30" y="650" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">· '준비 중' 표시는 비활성 표시다. 누르면 준비 중 안내창(SCR_COMMON_02)이 뜨고 페이지는 이동하지 않는다.</text>
<text x="30" y="676" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">· 수신자 화면의 CatchU는 브랜드 표시만 하며 누를 수 없다. 로그인·프로필·관리 메뉴를 두지 않는다.</text>
<text x="30" y="702" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">· 메뉴 구성은 #55 합의(9/22·9/23) 기준. 순서·간격 등 시각 표현은 #106에서 구현하며 확정 디자인이 아니다.</text>
