<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="1200" height="960" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="959" fill="none" stroke="#999999"/>

  <!-- 1. 12월 공통 헤더 -->
  <rect x="0.5" y="0.5" width="1199" height="64" fill="#f2f2f2" stroke="#999999"/>
  <text x="24" y="41" font-size="24" font-weight="700" fill="#222222">CatchU</text>
  <text x="150" y="39" font-size="16" font-weight="700" fill="#222222">내 자산</text>
  <line x1="150" y1="48" x2="202" y2="48" stroke="#222222" stroke-width="2"/>
  <text x="232" y="39" font-size="16" fill="#444444">채용공고</text>
  <text x="318" y="39" font-size="16" fill="#444444">공유 링크</text>
  <rect x="1010" y="17" width="72" height="30" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="1022" y="37" font-size="14" fill="#333333">알림</text>
  <rect x="1054" y="23" width="22" height="18" rx="9" fill="#333333"/>
  <text x="1065" y="36" font-size="11" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="1094" y="17" width="82" height="30" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="1135" y="37" font-size="14" fill="#333333" text-anchor="middle">프로필</text>
  <text x="600" y="38" font-size="12" fill="#888888" text-anchor="middle">메뉴 순서는 미정(9/16 결정)</text>

  <!-- 2. 내 자산으로 -->
  <rect x="40" y="84" width="150" height="36" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="115" y="107" font-size="15" fill="#333333" text-anchor="middle">← 내 자산으로</text>
  <text x="40" y="160" font-size="28" font-weight="700" fill="#222222">대표 구성</text>
  <text x="40" y="190" font-size="15" fill="#555555">대표 주장 1개와 Catch 2~3장을 한 벌로 구성합니다. 대표 없이도 링크를 발행할 수 있습니다.</text>

  <!-- 3. 대표 주장 직접 작성 -->
  <rect x="40" y="210" width="540" height="350" fill="#fafafa" stroke="#999999"/>
  <text x="64" y="244" font-size="18" font-weight="700" fill="#222222">대표 주장 직접 작성</text>
  <rect x="64" y="262" width="492" height="150" fill="#ffffff" stroke="#999999"/>
  <text x="80" y="292" font-size="16" fill="#333333">사용자가 실수해도 흐름이 끊기지 않도록</text>
  <text x="80" y="318" font-size="16" fill="#333333">입력 검사와 오류 안내를 꾸준히 다듬어 왔습니다.</text>
  <text x="540" y="400" font-size="12" fill="#888888" text-anchor="end">글자 수 제한 미정</text>
  <text x="64" y="442" font-size="14" fill="#555555">자신의 해석·보완을 적는 칸입니다.</text>
  <text x="64" y="466" font-size="14" fill="#555555">AI가 대신 작성하거나 첨삭하지 않습니다.</text>
  <rect x="64" y="490" width="492" height="40" fill="#eeeeee" stroke="#bbbbbb"/>
  <text x="80" y="515" font-size="14" fill="#444444">본인이 작성한 문장 — GitHub로 확인한 사실로 표시하지 않음</text>

  <!-- 4. 연결할 Catch 선택 -->
  <rect x="620" y="210" width="540" height="350" fill="#fafafa" stroke="#999999"/>
  <text x="644" y="244" font-size="18" font-weight="700" fill="#222222">연결할 Catch 선택</text>
  <text x="1136" y="244" font-size="15" fill="#333333" text-anchor="end">선택 2 / 2~3장</text>

  <rect x="644" y="262" width="492" height="56" fill="#ffffff" stroke="#bbbbbb"/>
  <rect x="656" y="280" width="20" height="20" fill="#333333" stroke="#333333"/>
  <path d="M660 290 L665 296 L673 284" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="690" y="286" font-size="16" fill="#222222">입력값 검사 테스트 보강</text>
  <text x="690" y="307" font-size="13" fill="#666666">공개 · 확인 완료</text>
  <rect x="1040" y="274" width="84" height="32" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="1082" y="295" font-size="13" fill="#333333" text-anchor="middle">근거 보기</text>

  <rect x="644" y="324" width="492" height="56" fill="#ffffff" stroke="#bbbbbb"/>
  <rect x="656" y="342" width="20" height="20" fill="#333333" stroke="#333333"/>
  <path d="M660 352 L665 358 L673 346" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="690" y="348" font-size="16" fill="#222222">로그인 실패 안내 문구 통일</text>
  <text x="690" y="369" font-size="13" fill="#666666">공개 · 확인 완료</text>
  <rect x="1040" y="336" width="84" height="32" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="1082" y="357" font-size="13" fill="#333333" text-anchor="middle">근거 보기</text>

  <rect x="644" y="386" width="492" height="56" fill="#ffffff" stroke="#bbbbbb"/>
  <rect x="656" y="404" width="20" height="20" fill="#ffffff" stroke="#666666"/>
  <text x="690" y="410" font-size="16" fill="#222222">목록 조회 페이지 나누기 추가</text>
  <text x="690" y="431" font-size="13" fill="#666666">공개 · 확인 완료</text>
  <rect x="1040" y="398" width="84" height="32" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="1082" y="419" font-size="13" fill="#333333" text-anchor="middle">근거 보기</text>

  <rect x="644" y="448" width="492" height="56" fill="#eeeeee" stroke="#cccccc" stroke-dasharray="4 3"/>
  <rect x="656" y="466" width="20" height="20" fill="#e0e0e0" stroke="#bbbbbb"/>
  <text x="690" y="472" font-size="16" fill="#999999">이미지 업로드 크기 제한</text>
  <text x="690" y="493" font-size="13" fill="#999999">미공개 · 확인 전 — 선택 전에 내 자산에서 확인</text>
  <rect x="1040" y="460" width="84" height="32" rx="4" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="1082" y="481" font-size="13" fill="#666666" text-anchor="middle">상태 확인</text>

  <text x="644" y="536" font-size="13" fill="#666666">4번째 선택 시 '최대 3장' 안내 · 1장 이하에서 저장하면 부족 안내</text>

  <!-- 7. 구성 미리보기 -->
  <rect x="40" y="590" width="1120" height="150" fill="#fafafa" stroke="#999999"/>
  <text x="64" y="624" font-size="18" font-weight="700" fill="#222222">구성 미리보기</text>
  <rect x="1016" y="602" width="120" height="34" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="1076" y="624" font-size="14" fill="#333333" text-anchor="middle">미리보기 열기</text>
  <rect x="64" y="642" width="520" height="80" fill="#ffffff" stroke="#bbbbbb"/>
  <text x="80" y="666" font-size="14" font-weight="700" fill="#333333">사용자가 실수해도 흐름이 끊기지 않도록 입력 검사와…</text>
  <rect x="80" y="680" width="236" height="30" fill="#eeeeee" stroke="#bbbbbb"/>
  <text x="92" y="700" font-size="13" fill="#444444">입력값 검사 테스트 보강</text>
  <rect x="330" y="680" width="236" height="30" fill="#eeeeee" stroke="#bbbbbb"/>
  <text x="342" y="700" font-size="13" fill="#444444">로그인 실패 안내 문구 통일</text>
  <text x="620" y="664" font-size="14" fill="#444444">· 대표 밖의 공개 Catch도 링크에서 열람할 수 있습니다.</text>
  <text x="620" y="690" font-size="14" fill="#444444">· 기존 링크의 대표 문구·연결 구성은 발행 당시 상태를 유지합니다.</text>
  <text x="620" y="716" font-size="14" fill="#444444">· 대표로 선택해도 Catch가 공개되지는 않습니다.</text>

  <!-- 8, 9. 하단 버튼 -->
  <rect x="40" y="770" width="270" height="44" rx="4" fill="#ffffff" stroke="#666666"/>
  <text x="175" y="798" font-size="15" fill="#333333" text-anchor="middle">대표 구성 없이 링크 발행으로</text>
  <text x="324" y="798" font-size="12" fill="#888888">대표 미저장 상태에서만 표시</text>
  <rect x="1000" y="770" width="160" height="44" rx="4" fill="#333333" stroke="#333333"/>
  <text x="1080" y="798" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">구성 저장</text>

  <!-- 10. 저장 성공 조건부 행 -->
  <rect x="40" y="832" width="1120" height="48" fill="#f2f2f2" stroke="#999999" stroke-dasharray="6 4"/>
  <text x="64" y="862" font-size="15" fill="#333333">구성을 저장했습니다.</text>
  <text x="220" y="862" font-size="12" fill="#888888">조건부 표시 — 편집 내용과 저장본이 같고 저장 중·실패가 아닐 때만</text>
  <rect x="1000" y="839" width="160" height="34" rx="4" fill="#ffffff" stroke="#666666"/>
  <text x="1080" y="861" font-size="14" fill="#333333" text-anchor="middle">링크 발행으로</text>

  <!-- 11. DM 진입 -->
  <rect x="1070" y="896" width="100" height="40" rx="20" fill="#ffffff" stroke="#666666"/>
  <text x="1120" y="921" font-size="15" fill="#333333" text-anchor="middle">DM</text>

  <text x="40" y="928" font-size="12" fill="#888888">12월 계획 · 흑백 와이어프레임 · 합성 예시 · 미승인(12월 intent 요구사항 분석 전)</text>

  <!-- 번호 원 -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="1000" cy="16" r="13" fill="#333333"/><text x="1000" y="21" fill="#ffffff">1</text>
    <circle cx="36" cy="84" r="13" fill="#333333"/><text x="36" y="89" fill="#ffffff">2</text>
    <circle cx="60" cy="262" r="13" fill="#333333"/><text x="60" y="267" fill="#ffffff">3</text>
    <circle cx="620" cy="238" r="13" fill="#333333"/><text x="620" y="243" fill="#ffffff">4</text>
    <circle cx="1036" cy="272" r="13" fill="#333333"/><text x="1036" y="277" fill="#ffffff">5</text>
    <circle cx="640" cy="448" r="13" fill="#333333"/><text x="640" y="453" fill="#ffffff">6</text>
    <circle cx="40" cy="610" r="13" fill="#333333"/><text x="40" y="615" fill="#ffffff">7</text>
    <circle cx="36" cy="770" r="13" fill="#333333"/><text x="36" y="775" fill="#ffffff">8</text>
    <circle cx="996" cy="770" r="13" fill="#333333"/><text x="996" y="775" fill="#ffffff">9</text>
    <circle cx="36" cy="832" r="13" fill="#333333"/><text x="36" y="837" fill="#ffffff">10</text>
    <circle cx="1066" cy="896" r="13" fill="#333333"/><text x="1066" y="901" fill="#ffffff">11</text>
  </g>
</svg>
