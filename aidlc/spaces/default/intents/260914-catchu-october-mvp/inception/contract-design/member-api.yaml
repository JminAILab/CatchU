openapi: "3.0.3"
info: {"title":"CatchU 회원 API v1","version":"1.0.0"}
servers: [{"url":"/v1"}]
security: [{"AccessJWT":[]}]
paths:
  "/me":
    get:
      operationId: "getMe"
      summary: "getMe"
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/Member"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/me/profile":
    put:
      operationId: "replaceProfile"
      summary: "자가 입력 기본 프로필 전체 저장; 공개 항목 상세는 OQ-A2"
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/Profile"}}}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/Profile"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/me/repositories":
    get:
      operationId: "listEligibleRepositories"
      summary: "연동 계정의 선정 지원 공개 저장소만 제공"
      parameters:
        - {"name":"cursor","in":"query","schema":{"type":"string"}}
        - {"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required: ["items","page"]
                properties:
                  items: {"type":"array","items":{"$ref":"./common.yaml#/components/schemas/Repository"}}
                  page: {"$ref":"./common.yaml#/components/schemas/PageInfo"}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/analysis-notice":
    get:
      operationId: "getAnalysisNotice"
      summary: "현재 고지; 실제 자료 처리 조건 충족을 대신하지 않음"
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required: ["noticeRevision","text"]
                properties: {"noticeRevision":{"type":"string","minLength":1},"text":{"type":"string"}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/analysis-requests":
    get:
      operationId: "listAnalysisRequests"
      summary: "listAnalysisRequests"
      parameters:
        - {"name":"cursor","in":"query","schema":{"type":"string"}}
        - {"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required: ["items","page"]
                properties:
                  items: {"type":"array","items":{"$ref":"./common.yaml#/components/schemas/AnalysisStatus"}}
                  page: {"$ref":"./common.yaml#/components/schemas/PageInfo"}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
    post:
      operationId: "createAnalysisRequest"
      summary: "createAnalysisRequest"
      parameters:
        - 
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema: {"type":"string","minLength":1,"maxLength":128}
          description: "사용자·operation 범위 키. 응답 불명은 같은 키·같은 본문으로 조회/재접수하며 다른 본문은 409."
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/AnalysisCreate"}}}}
      responses:
        "200":
          description: "동일 저장소 진행 중 작업 또는 멱등 재응답"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/AnalysisStatus"}}}
        "202":
          description: "새 요청 접수"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/AnalysisStatus"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/analysis-requests/{requestId}":
    parameters: [{"name":"requestId","in":"path","required":true,"schema":{"type":"string","minLength":1}}]
    get:
      operationId: "getAnalysisRequest"
      summary: "getAnalysisRequest"
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/AnalysisStatus"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/catches":
    get:
      operationId: "listCatches"
      summary: "listCatches"
      description: "repositoryId와 sourceRequestId를 함께 주면 두 조건을 모두 만족하는 본인 Catch만 반환한다."
      parameters:
        - {"name":"cursor","in":"query","schema":{"type":"string"}}
        - {"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}
        - {"name":"sourceRequestId","in":"query","schema":{"type":"string","minLength":1}}
        - {"name":"repositoryId","in":"query","required":false,"schema":{"type":"string","minLength":1}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required: ["items","page"]
                properties:
                  items: {"type":"array","items":{"$ref":"./common.yaml#/components/schemas/Catch"}}
                  page: {"$ref":"./common.yaml#/components/schemas/PageInfo"}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/catches/{catchId}":
    parameters: [{"name":"catchId","in":"path","required":true,"schema":{"type":"string","minLength":1}}]
    get:
      operationId: "getCatch"
      summary: "getCatch"
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/Catch"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/catches/{catchId}/confirmation":
    parameters: [{"name":"catchId","in":"path","required":true,"schema":{"type":"string","minLength":1}}]
    put:
      operationId: "confirmCatch"
      summary: "본인의 명시적 확인; 공개하지 않음"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["workFactsConfirmed","contributionConfirmed"]
              properties: {"workFactsConfirmed":{"type":"boolean","enum":[true]},"contributionConfirmed":{"type":"boolean","enum":[true]}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/Catch"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/catches/{catchId}/visibility":
    parameters: [{"name":"catchId","in":"path","required":true,"schema":{"type":"string","minLength":1}}]
    put:
      operationId: "setCatchVisibility"
      summary: "PUBLIC은 확인/현재 보호 조건을 원자적으로 검사; PRIVATE은 숨김"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["visibility"]
              properties: {"visibility":{"type":"string","enum":["PRIVATE","PUBLIC"]}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/Catch"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/catches/{catchId}/mismatch":
    parameters: [{"name":"catchId","in":"path","required":true,"schema":{"type":"string","minLength":1}}]
    put:
      operationId: "setCatchMismatch"
      summary: "불일치 표시만 변경; 본문/공개/생성 상태 불변"
      requestBody:
        required: true
        content:
          "application/json": {"schema":{"type":"object","additionalProperties":false,"required":["mismatch"],"properties":{"mismatch":{"type":"boolean"}}}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/Catch"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/share-links":
    get:
      operationId: "listShareLinks"
      summary: "listShareLinks"
      parameters:
        - {"name":"cursor","in":"query","schema":{"type":"string"}}
        - {"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required: ["items","page"]
                properties:
                  items: {"type":"array","items":{"$ref":"./common.yaml#/components/schemas/ShareLink"}}
                  page: {"$ref":"./common.yaml#/components/schemas/PageInfo"}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
    post:
      operationId: "createShareLink"
      summary: "createShareLink"
      parameters:
        - 
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema: {"type":"string","minLength":1,"maxLength":128}
          description: "사용자·operation 범위 키. 응답 불명은 같은 키·같은 본문으로 조회/재접수하며 다른 본문은 409."
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/ShareCreate"}}}}
      responses:
        "200":
          description: "동일 멱등 키의 기존 발급 결과"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/ShareLink"}}}
        "201":
          description: "발급"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/ShareLink"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "429": {"$ref":"./common.yaml#/components/responses/Error429"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/share-links/{linkId}/stop":
    parameters: [{"name":"linkId","in":"path","required":true,"schema":{"type":"string","minLength":1}}]
    put:
      operationId: "stopShareLink"
      summary: "중단은 반복 가능; 복구·제목/비밀번호 변경 API 없음. 업무 판정은 200과 404만 쓰고 403·409는 쓰지 않는다(인증 실패 401·서버 오류 500은 회원 경로 공통). 소유 확인을 상태 확인보다 먼저 해 타인·없는 링크는 회원 경로 공통 404다"
      responses:
        "200":
          description: "성공. 본인 링크는 첫 중단도, 이미 중단·만료된 링크도 200이며 현재 상태를 반환한다(중단은 만료 시각 뒤에도 STOPPED 유지, 만료 링크는 중단 처리 없이 EXPIRED 유지)"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/ShareLink"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "409": {"$ref":"./common.yaml#/components/responses/Error409"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/auth/google/authorization":
    post:
      operationId: "startGoogleLogin"
      summary: "Google 로그인 시작. 회원 Access 없이 호출한다"
      description: "인증 주소는 openid profile만 요청한다. loginAttemptToken은 시작한 브라우저가 보관했다가 완료 요청에 보내는 확인값이며 Google 주소·콜백에 넣지 않는다. expiresIn은 이 로그인 시도의 수명(현재 600초)이며 로그인 세션 수명이 아니다. Google 로그인이 꺼진 환경은 404/RESOURCE_UNAVAILABLE, 추가 본문·query는 400/VALIDATION_FAILED다"
      security: []
      requestBody: {"required":false,"content":{"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/EmptyRequest"}}}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required: ["authorizationUrl","loginAttemptToken","expiresIn"]
                properties: {"authorizationUrl":{"type":"string","format":"uri"},"loginAttemptToken":{"type":"string","pattern":"^[A-Za-z0-9_-]{43}$"},"expiresIn":{"type":"integer","minimum":1}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/auth/google/login":
    post:
      operationId: "completeGoogleLogin"
      summary: "Google 로그인 완료 또는 취소. 회원 Access 없이 호출한다"
      description: "입력 형식을 통과하고 시작 브라우저 확인값이 맞으면 로그인 시도를 Google 교환 전에 소비하며, 취소·교환 실패·DB 실패 뒤에도 다시 쓸 수 없다(새로 시작). 시도 없음·만료·이미 사용, 확인값 불일치, Google 코드·서명·claim 검증 실패, 비활성 회원은 401/AUTH_INVALID이며 CatchU 회원 세션 만료와 다른 뜻이다. 형식 오류·추가 필드·code와 error 동시 지정·access_denied 밖의 error는 400/VALIDATION_FAILED이고 시도를 소비하지 않는다. Google 로그인이 꺼진 환경은 404/RESOURCE_UNAVAILABLE, Google 통신·DB·커밋·서명 실패는 500이며 이때 성공 응답·쿠키를 보내지 않는다"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              oneOf:
                - {"type":"object","additionalProperties":false,"required":["state","loginAttemptToken","code"],"properties":{"state":{"type":"string","pattern":"^[A-Za-z0-9_-]{43}$"},"loginAttemptToken":{"type":"string","pattern":"^[A-Za-z0-9_-]{43}$"},"code":{"type":"string","minLength":1,"maxLength":4096,"pattern":"^[^\\s\\x00-\\x1F\\x7F]+$","description":"공백·제어 문자 없음"}}}
                - {"type":"object","additionalProperties":false,"required":["state","loginAttemptToken","error"],"properties":{"state":{"type":"string","pattern":"^[A-Za-z0-9_-]{43}$"},"loginAttemptToken":{"type":"string","pattern":"^[A-Za-z0-9_-]{43}$"},"error":{"type":"string","enum":["access_denied"]}}}
      responses:
        "200":
          description: "로그인 성공이면 GoogleLoginResult와 Set-Cookie의 Refresh. Google 승인 취소면 {cancelled: true}이며 회원·세션·쿠키를 만들지 않는다"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"},"Set-Cookie":{"$ref":"./common.yaml#/components/headers/SetRefreshCookie"}}
          content:
            "application/json":
              schema:
                oneOf:
                  - {"$ref":"./common.yaml#/components/schemas/GoogleLoginResult"}
                  - {"type":"object","additionalProperties":false,"required":["cancelled"],"properties":{"cancelled":{"type":"boolean","enum":[true]}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/auth/refresh":
    post:
      operationId: "refreshSession"
      summary: "Refresh 쿠키로 Access를 다시 받고 Refresh를 교체한다. 회원 Access 대신 Refresh 쿠키와 Origin으로 보호한다"
      description: "Origin을 먼저 검사한다. 다르거나 없으면 403/AUTH_ORIGIN_FORBIDDEN이며 쿠키·세션을 바꾸지 않는다. 추가 본문·query는 400/VALIDATION_FAILED이고 Refresh를 쓰지 않는다. 쿠키 없음·형식 오류·같은 이름 쿠키 여러 개·알 수 없는 값·끝난 세션·이미 사용한 Refresh는 401/AUTH_INVALID와 쿠키 제거이며, 이미 사용한 Refresh가 다시 오면 그 세션 전체를 끝낸다. DB·서명·커밋 실패는 500이며 새 쿠키도 제거 쿠키도 보내지 않는다"
      security: [{"RefreshCookie":[]}]
      parameters: [{"$ref":"#/components/parameters/Origin"}]
      requestBody: {"required":false,"content":{"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/EmptyRequest"}}}}
      responses:
        "200":
          description: "새 Access와 교체한 Refresh 쿠키"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"},"Set-Cookie":{"$ref":"./common.yaml#/components/headers/SetRefreshCookie"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/AccessToken"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401ClearRefresh"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/auth/logout":
    post:
      operationId: "logout"
      summary: "현재 브라우저의 Refresh 쿠키가 가리키는 로그인 세션만 끝낸다. 다른 기기의 세션은 유지한다"
      description: "Origin을 먼저 검사한다. 통과하면 현재 Refresh와 이미 사용한 Refresh 모두 같은 세션을 끝내고, 쿠키가 없거나 알 수 없는 값·이미 끝난 세션이어도 같은 204와 쿠키 제거로 답한다. 쿠키 없는 204는 따로 가진 Access의 세션을 끝냈다는 뜻이 아니다. Origin이 다르거나 없으면 403/AUTH_ORIGIN_FORBIDDEN, 추가 본문·query는 400/VALIDATION_FAILED, DB 실패는 500이며 셋 모두 쿠키를 바꾸지 않는다"
      security: [{"RefreshCookie":[]},{}]
      parameters: [{"$ref":"#/components/parameters/Origin"}]
      requestBody: {"required":false,"content":{"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/EmptyRequest"}}}}
      responses:
        "204":
          description: "종료 또는 끝낼 세션 없음. 빈 본문"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"},"Set-Cookie":{"$ref":"./common.yaml#/components/headers/ClearRefreshCookie"}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/me/github/authorization":
    post:
      operationId: "startGitHubConnection"
      summary: "GitHub 계정 연결 시작. 추가 권한(scope) 없는 OAuth App의 인증 주소와 이 절차의 state를 준다"
      description: "state는 회원마다 하나이며 10분 동안 한 번만 쓸 수 있고, 새로 시작하면 이전 state를 대체한다. expiresAt은 이 state의 만료 시각이며 GitHub 토큰 수명이 아니다. GitHub 연결 기능이 꺼진 환경은 403/GITHUB_CONNECTION_REQUIRED, 추가 본문·query는 400/VALIDATION_FAILED다"
      requestBody: {"required":false,"content":{"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/EmptyRequest"}}}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required: ["authorizationUrl","state","expiresAt"]
                properties: {"authorizationUrl":{"type":"string","format":"uri"},"state":{"type":"string","pattern":"^[a-f0-9]{64}$"},"expiresAt":{"type":"string","format":"date-time"}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/me/github/connection":
    post:
      operationId: "completeGitHubConnection"
      summary: "GitHub 승인 뒤 콜백으로 받은 code·state로 연결을 완료한다. 성공은 state CONNECTED와 accountLogin"
      description: "state가 없거나 만료·이미 사용·대체됐거나, 돌아온 권한이 추가 권한 없음과 다르거나, 발급 응답이 맞지 않으면 400/INVALID_REQUEST이며 새로 시작해야 한다. 형식 오류·추가 필드는 400/VALIDATION_FAILED다. 사용자가 GitHub에서 취소하면 이 경로를 부르지 않으며 기존 연결을 유지한다. 새 시작·해제와 겹친 늦은 완료는 현재 연결을 덮어쓰지 않는다. GitHub 연결 기능이 꺼진 환경은 403/GITHUB_CONNECTION_REQUIRED, GitHub 통신 장애·자격정보 보관·DB 실패는 500이다"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required: ["code","state"]
              properties: {"code":{"type":"string","pattern":"^[!-~]{1,512}$"},"state":{"type":"string","pattern":"^[a-f0-9]{64}$"}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/GitHubConnection"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
    delete:
      operationId: "disconnectGitHub"
      summary: "CatchU에 저장한 GitHub 연결과 자격정보를 지운다. 성공은 state DISCONNECTED와 accountLogin null"
      description: "본문은 없거나 {}만 받고 다른 필드·query는 400/VALIDATION_FAILED다. 연결이 없어도 같은 200이다. GitHub에 남은 앱 승인 자체를 취소하지는 않는다. GitHub 연결 기능이 꺼진 환경은 403/GITHUB_CONNECTION_REQUIRED, DB·보관 정리 실패는 500이다"
      requestBody: {"required":false,"content":{"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/EmptyRequest"}}}}
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content: {"application/json":{"schema":{"$ref":"./common.yaml#/components/schemas/GitHubConnection"}}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "403": {"$ref":"./common.yaml#/components/responses/Error403"}
        "404": {"$ref":"./common.yaml#/components/responses/Error404"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
  "/me/analysis-summary":
    get:
      operationId: "getAnalysisSummary"
      summary: "홈용 본인 분석 접수 이력 유무"
      description: "인증된 본인의 영속 접수 요청(requestState ACCEPTED)이 1건 이상이면 true, 정상 조회 결과 0건이면 false다. 처리 상태와 무관하고 현재 선정 목록에서 빠진 저장소의 요청도 센다. 거절된 시도와 다른 회원의 요청은 세지 않는다. true는 현재 분석 가능이나 분석 완료를 뜻하지 않는다. query가 붙으면 400/VALIDATION_FAILED, 조회 실패는 false가 아닌 500/INTERNAL_ERROR다"
      responses:
        "200":
          description: "성공"
          headers: {"Cache-Control":{"$ref":"./common.yaml#/components/headers/NoStore"}}
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required: ["hasAcceptedAnalysisRepository"]
                properties: {"hasAcceptedAnalysisRepository":{"type":"boolean"}}
        "400": {"$ref":"./common.yaml#/components/responses/Error400"}
        "401": {"$ref":"./common.yaml#/components/responses/Error401"}
        "500": {"$ref":"./common.yaml#/components/responses/Error500"}
components:
  securitySchemes: {"AccessJWT":{"type":"http","scheme":"bearer","bearerFormat":"JWT"},"RefreshCookie":{"type":"apiKey","in":"cookie","name":"catchu_refresh"}}
  parameters: {"Origin":{"name":"Origin","in":"header","required":true,"schema":{"type":"string"},"description":"web 출처(AUTH_WEB_ORIGIN)와 정확히 같아야 한다. 브라우저가 보낸다"}}
