# 개발 서버 앞단 Caddy(#276, 12월 전 개발 단계 전용). 앱(compose.single.yaml)과 다른 Compose 묶음이라
# replace-single.sh로 앱을 교체해도 Caddy는 그대로 돈다(교체하는 동안 Caddy는 502를 돌려준다).
# 서버의 망을 그대로 써서(host) 80·443을 받고, 127.0.0.1에만 열린 web(3000)·api(3001)로 넘긴다. 사용법은 README.md.
name: ${CATCHU_SINGLE_NAME:-catchu-dev}-edge

services:
  caddy:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    container_name: ${CATCHU_SINGLE_NAME:-catchu-dev}-caddy
    network_mode: host
    environment:
      CATCHU_DOMAIN: ${CATCHU_DOMAIN:?공개 도메인(CATCHU_DOMAIN)이 필요합니다}
    volumes:
      # 파일이 없으면 빈 폴더를 만들지 않고 시작하지 않는다.
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      # 인증서 보관. 지우면 다시 띄울 때 새로 발급받아 Let's Encrypt 발급 횟수 제한에 걸릴 수 있다.
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
