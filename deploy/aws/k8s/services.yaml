# web·api의 클러스터 안 주소(#276). 바깥으로 여는 Service(LoadBalancer·NodePort)는 두지 않고 ALB(ingress.yaml)로만 받는다.
# worker·DB·큐에는 Service를 두지 않는다. worker는 api를 http://api.catchu.svc.cluster.local:3001 로 부른다(worker.yaml).
# NetworkPolicy가 맞게 걸리도록 Service 포트와 컨테이너 포트를 같게 둔다. ALB 상태 확인 경로는 Service마다 정한다.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: catchu
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: catchu
  annotations:
    # /health는 /v1 밖이라 바깥 주소로는 닿지 않고(web으로 간다), ALB가 Pod에 직접 묻는다. DB·큐를 보지 않는 고정 응답이다.
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
