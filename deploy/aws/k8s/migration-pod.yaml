# migration 일회 Pod 틀(#276). deploy.sh만 쓴다. 밑줄 두 개로 감싼 자리(Pod 이름 catchu-migrate-<커밋 앞 12자>·이미지 digest·커밋)를 채워 kubectl create한다.
# controller 없는 Pod이고 다시 띄우지 않는다(restartPolicy Never). Job은 실패 때 대체 Pod를 만들 수 있어 쓰지 않는다(deploy/README.md 「migration」).
# 끝난 Pod는 지우지 않고 기록으로 남긴다. 같은 이름이 성공 아닌 상태로 남아 있으면 deploy.sh는 새로 만들지 않고 멈춘다.
# DB에는 migration 전용 계정(catchu_migrator)으로 TLS·인증서 검증을 거쳐 붙는다. 비밀번호는 Secret catchu-migration에서 받는다.
apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
  namespace: catchu
  labels:
    app.kubernetes.io/name: migration
    app.kubernetes.io/part-of: catchu
  annotations:
    catchu.io/source-revision: __COMMIT__
spec:
  restartPolicy: Never
  # 노드에서 시작한 뒤 10분이 지나도 끝나지 않으면 실패로 끝낸다.
  activeDeadlineSeconds: 600
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: migration
      image: __IMAGE__
      env:
        - name: PGSSLMODE
          value: verify-full
        - name: NODE_EXTRA_CA_CERTS
          value: /run/catchu/db-ca.pem
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "1"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: catchu-db
              key: DB_HOST
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: catchu
        - name: DB_USER
          value: catchu_migrator
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catchu-migration
              key: DB_PASSWORD
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
          ephemeral-storage: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: db-ca
          mountPath: /run/catchu
          readOnly: true
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
    - name: db-ca
      configMap:
        name: catchu-db
        items:
          - key: ca.pem
            path: db-ca.pem
