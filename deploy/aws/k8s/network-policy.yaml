# namespace catchu의 연결 허용 목록(#276). 기본은 모두 막고 아래만 연다. 적용은 deploy/aws/k8s/README.md 「적용(2단계)」.
# 대역은 cluster.yaml(VPC 192.168.0.0/16, 가용 영역 2a·2c)로 eksctl이 정하는 값이다.
#   퍼블릭 서브넷(ALB): 192.168.0.0/19, 192.168.32.0/19   프라이빗 서브넷(노드·RDS·큐): 192.168.64.0/19, 192.168.96.0/19
#   클러스터를 만든 뒤 실제 서브넷 대역과 같은지 확인하고 적용한다. 다르면 이 파일과 api.yaml의 TRUST_PROXY_CIDRS를 먼저 고친다.
# DB·큐는 주소 하나(/32)가 아니라 프라이빗 서브넷 대역으로 연다. 장애 조치·교체 때 DB·큐의 IP가 바뀌어도 끊기지 않게 하려는 것이다.
# NetworkPolicy는 Service 포트와 컨테이너 포트가 같아야 맞게 걸린다(services.yaml).
# 한계: 새 Pod는 정책이 걸리기 전 몇 초 동안 막히지 않는다(VPC CNI 기본 모드). controller 없이 만든 Pod(migration)에는
# 정책이 믿을 만하게 걸리지 않을 수 있다. 노드·호스트 망 Pod·다른 namespace의 Pod는 이 정책 밖이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: catchu
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 모든 Pod: 클러스터 DNS(CoreDNS)만
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: catchu
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# web: ALB(퍼블릭 서브넷)에서 3000만 받는다. 나가는 것은 DNS뿐이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  namespace: catchu
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.0.0/19
        - ipBlock:
            cidr: 192.168.32.0/19
      ports:
        - protocol: TCP
          port: 3000
---
# api: ALB와 worker에서 3001을 받는다. DB 5432·큐 6379(프라이빗 서브넷), 바깥 443(Google·GitHub 로그인)으로 나간다.
# 바깥 443에서 VPC 대역과 노드 메타데이터 대역(169.254.0.0/16)은 뺀다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: catchu
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.0.0/19
        - ipBlock:
            cidr: 192.168.32.0/19
      ports:
        - protocol: TCP
          port: 3001
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: worker
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.64.0/19
        - ipBlock:
            cidr: 192.168.96.0/19
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 192.168.0.0/16
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
# worker: 들어오는 연결은 없다. kubelet의 상태 확인은 노드에서 오며, 쿠버네티스 규정상 NetworkPolicy가 막지 않는다(2단계에서 확인).
# 나가는 것은 api 3001(요청 정보 조회), 큐 6379(프라이빗 서브넷), GitHub API·Anthropic API 대역 443뿐이다. DB 5432는 열지 않는다.
# GitHub API 대역은 https://api.github.com/meta 의 api 항목 IPv4 24개(2026-10-19 조회)다. GitHub는 이 대역을 바꿀 수 있고
# 목록이 전부가 아니라고 밝힌다. 수집이 시간 초과로 막히면 deploy/aws/k8s/README.md 「worker 바깥 연결 대역 갱신」대로 다시 받아 고친다.
# Anthropic API 대역 160.79.104.0/23은 Anthropic이 공지 없이 바꾸지 않는다고 밝힌 값이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  namespace: catchu
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - ipBlock:
            cidr: 192.168.64.0/19
        - ipBlock:
            cidr: 192.168.96.0/19
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 140.82.112.0/20
        - ipBlock:
            cidr: 143.55.64.0/20
        - ipBlock:
            cidr: 172.182.252.137/32
        - ipBlock:
            cidr: 185.199.108.0/22
        - ipBlock:
            cidr: 192.30.252.0/22
        - ipBlock:
            cidr: 20.175.192.149/32
        - ipBlock:
            cidr: 20.199.39.228/32
        - ipBlock:
            cidr: 20.200.245.245/32
        - ipBlock:
            cidr: 20.201.28.148/32
        - ipBlock:
            cidr: 20.205.243.168/32
        - ipBlock:
            cidr: 20.207.73.85/32
        - ipBlock:
            cidr: 20.217.135.0/32
        - ipBlock:
            cidr: 20.233.83.146/32
        - ipBlock:
            cidr: 20.26.156.210/32
        - ipBlock:
            cidr: 20.27.177.116/32
        - ipBlock:
            cidr: 20.29.134.17/32
        - ipBlock:
            cidr: 20.87.245.6/32
        - ipBlock:
            cidr: 4.208.26.200/32
        - ipBlock:
            cidr: 4.225.11.201/32
        - ipBlock:
            cidr: 4.228.31.149/32
        - ipBlock:
            cidr: 4.237.22.34/32
        - ipBlock:
            cidr: 4.249.131.166/32
        - ipBlock:
            cidr: 48.202.248.39/32
        - ipBlock:
            cidr: 48.204.201.2/32
        - ipBlock:
            cidr: 160.79.104.0/23
      ports:
        - protocol: TCP
          port: 443
---
# migration 일회 Pod: DB 5432(프라이빗 서브넷)로만 나간다. 들어오는 연결은 없다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migration
  namespace: catchu
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: migration
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.64.0/19
        - ipBlock:
            cidr: 192.168.96.0/19
      ports:
        - protocol: TCP
          port: 5432
