# api Deployment(#276). deploy.sh만 적용한다. 밑줄 두 개로 감싼 자리(이미지 digest·실행 수·커밋)를 채워서 쓴다.
# 이 파일을 그대로 kubectl apply하면 실행 수 자리가 숫자가 아니어서 거부된다(운영 중인 판본을 자리표시 이미지로 덮지 않게).
# 한 개만 띄우고(Recreate) 자동 확장은 두지 않는다. Recreate는 교체 때만 옛 Pod 종료 뒤 새 Pod를 띄우고, 노드 장애 때 생기는
# 대체 실행과의 겹침은 막지 못한다. 그래서 교체는 deploy.sh가 옛 api·worker의 종료를 먼저 확인한 뒤 한다.
# 값의 뜻은 api/docs/environment.md. 비밀값은 Secret catchu-api, DB 주소·CA는 ConfigMap catchu-db에서 받는다(deploy/aws/k8s/README.md 「Secret과 ConfigMap」).
# 꺼 둔 기능(Google 로그인·GitHub 연결·worker 요청 정보 조회·큐 연결)은 켤 때 그 값과 함께 이 파일을 고친다(deploy/aws/README.md 「단계와 시작 조건」 5단계).
# 자원 값은 개발 서버 대기 상태 측정(api 약 70MiB) 기준의 시작값이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: catchu
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: catchu
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: catchu
      annotations:
        catchu.io/source-revision: __COMMIT__
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: BIND_HOST
              value: 0.0.0.0
            - name: PORT
              value: "3001"
            # DB TLS: 인증서와 호스트 이름을 검증한다. pg는 PGSSLROOTCERT를 읽지 않아 CA 파일을 NODE_EXTRA_CA_CERTS로 넣는다.
            - name: PGSSLMODE
              value: verify-full
            - name: NODE_EXTRA_CA_CERTS
              value: /run/catchu/db-ca.pem
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: AUTH_ACCESS_TOKEN_TTL_SECONDS
              value: "900"
            - name: AUTH_WEB_ORIGIN
              value: https://catchu.dev
            - name: SHARE_LINK_WEB_BASE_URL
              value: https://catchu.dev
            # ALB가 있는 퍼블릭 서브넷 대역(network-policy.yaml과 같은 값). 이 대역이 붙인 X-Forwarded-For로만 요청 주소를 정한다.
            - name: TRUST_PROXY_CIDRS
              value: 192.168.0.0/19,192.168.32.0/19
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: catchu-db
                  key: DB_HOST
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: catchu
            - name: DB_USER
              value: catchu_app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: DB_PASSWORD
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: AUTH_JWT_SECRET
            - name: LINK_GRANT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: LINK_GRANT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
              ephemeral-storage: 256Mi
          # /health는 DB를 보지 않는 고정 응답이라, DB 장애로 api가 다시 시작되지는 않는다.
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /run/catchu
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-ca
          configMap:
            name: catchu-db
            items:
              - key: ca.pem
                path: db-ca.pem
