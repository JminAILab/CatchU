# api Deployment(#276). deploy.sh만 적용한다. 밑줄 두 개로 감싼 자리(이미지 digest·실행 수·커밋)를 채워서 쓴다.
# 이 파일을 그대로 kubectl apply하면 실행 수 자리가 숫자가 아니어서 거부된다(운영 중인 판본을 자리표시 이미지로 덮지 않게).
# 한 개만 띄우고(Recreate) 자동 확장은 두지 않는다. Recreate는 교체 때만 옛 Pod 종료 뒤 새 Pod를 띄우고, 노드 장애 때 생기는
# 대체 실행과의 겹침은 막지 못한다. 그래서 교체는 deploy.sh가 옛 api·worker의 종료를 먼저 확인한 뒤 한다.
# 값의 뜻은 api/docs/environment.md. 비밀값은 Secret catchu-api, DB 주소·CA는 ConfigMap catchu-db에서 받는다(deploy/aws/k8s/README.md 「Secret과 ConfigMap」).
# 큐 연결·worker 요청 정보 조회·GitHub 연결을 켰다(deploy/aws/README.md 「단계와 시작 조건」 5단계). 켠 판본을 띄우기 전에 Secret과
# GitHub 토큰 보관 볼륨을 먼저 맞춘다(deploy/aws/features.md 「적용 순서」). 없으면 새 api가 뜨지 못한다.
# Google 로그인은 개발 서버에서 켜 둔 것을 전환 뒤에도 이어 가려고 처음부터 켠다(2026-11-10 팀장 결정).
# 회원 파일(PDF 원본·발행 사본)은 S3 버킷에 둔다. AWS 권한은 서비스 계정 api에 붙인 역할로 받고(cluster.yaml) 접근 키는 넣지 않는다.
# 자원 값은 개발 서버 대기 상태 측정(api 약 70MiB) 기준의 시작값이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: catchu
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: catchu
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: catchu
      annotations:
        catchu.io/source-revision: __COMMIT__
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: BIND_HOST
              value: 0.0.0.0
            - name: PORT
              value: "3001"
            # DB TLS: 인증서와 호스트 이름을 검증한다. pg는 PGSSLROOTCERT를 읽지 않아 CA 파일을 NODE_EXTRA_CA_CERTS로 넣는다.
            - name: PGSSLMODE
              value: verify-full
            - name: NODE_EXTRA_CA_CERTS
              value: /run/catchu/db-ca.pem
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "1"
            - name: AUTH_ACCESS_TOKEN_TTL_SECONDS
              value: "900"
            - name: AUTH_WEB_ORIGIN
              value: https://catchu.dev
            - name: SHARE_LINK_WEB_BASE_URL
              value: https://catchu.dev
            # ALB가 있는 퍼블릭 서브넷 대역(network-policy.yaml과 같은 값). 이 대역이 붙인 X-Forwarded-For로만 요청 주소를 정한다.
            - name: TRUST_PROXY_CIDRS
              value: 192.168.0.0/19,192.168.32.0/19
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: catchu-db
                  key: DB_HOST
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: catchu
            - name: DB_USER
              value: catchu_app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: DB_PASSWORD
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: AUTH_JWT_SECRET
            - name: LINK_GRANT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: LINK_GRANT_SECRET
            - name: CATCHU_GENERATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: CATCHU_GENERATION_API_KEY
            - name: CATCHU_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: CATCHU_EMBEDDING_API_KEY
            # 큐 연결(api/docs/analysis-queue.md). 주소가 있으면 api가 대기 중인 분석 시도를 큐로 보내고, worker가 보낸 진행 알림·결과를
            # 받아 반영한다(결과 수신은 이 연결 안에 있어 따로 켜는 값이 없다). 11월 기능의 백그라운드 실행(AiRun, api/docs/ai-run.md)도
            # 같은 주소를 쓴다. 주소에 큐 비밀번호가 들어 있어 주소 전체를 Secret으로 받는다. 접두사는 worker.yaml과 같아야 한다.
            # 받기가 예상 밖으로 멈추면 api가 종료 코드 1로 끝나고 쿠버네티스가 다시 띄운다(/health는 큐를 보지 않는다).
            - name: CATCHU_QUEUE_PREFIX
              value: catchu
            - name: CATCHU_QUEUE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: CATCHU_QUEUE_REDIS_URL
            # worker 요청 정보 조회(api/docs/worker-context.md). worker가 분석을 시작할 때 /v1/internal 경로로 접수 기록·선정 범위·GitHub
            # 자격정보를 받아 간다. 이 경로는 worker Pod에서만 닿는다: NetworkPolicy가 api 3001을 ALB와 worker에서만 받고, ALB(Ingress)와
            # WAF는 /v1/internal을 404로 돌려준다. 키는 worker의 WORKER_CONTEXT_API_KEY와 같은 값이어야 하고(같은 SSM 값에서 만든다),
            # 서명 키 둘·GitHub 보관 암호화 키와 같으면 api가 뜨지 않는다. 꺼져 있으면 worker의 실제 분석이 수집 없이 실패한다.
            - name: WORKER_CONTEXT_ENABLED
              value: "true"
            - name: WORKER_CONTEXT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: WORKER_CONTEXT_API_KEY
            # GitHub 연결(api/docs/github-connection.md). 회원이 GitHub 계정을 연결하면 api가 토큰을 암호화해 보관 폴더에 두고, worker 요청
            # 정보 조회 때 꺼내 준다. 꺼져 있으면 실제 회원의 분석 접수가 403(GITHUB_CONNECTION_REQUIRED)이다. 따로 켜는 LIVE 분석 값은 없다.
            # 돌아올 주소는 GitHub OAuth App에 등록한 값과 글자 하나까지 같아야 한다(web의 /github/callback 화면).
            # 보관 폴더는 EFS 접근점을 붙인 볼륨이다(github-credentials-volume.yaml). Pod가 바뀌어도 암호문이 남아야 연결이 유지된다.
            # 암호화 키는 서명 키 둘·조회 키와 달라야 하고, 바꾸면 보관된 토큰을 풀지 못해 회원이 다시 연결해야 한다.
            # 시작·완료 사이의 state는 api 메모리에만 있다. api가 한 개라 문제없고, 다시 뜨면 진행 중이던 연결만 처음부터 한다.
            - name: GITHUB_CONNECTION_ENABLED
              value: "true"
            - name: GITHUB_OAUTH_CALLBACK_URL
              value: https://catchu.dev/github/callback
            - name: GITHUB_CREDENTIAL_DIRECTORY
              value: /var/lib/catchu/github-credentials
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: GITHUB_OAUTH_CLIENT_ID
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: GITHUB_OAUTH_CLIENT_SECRET
            - name: GITHUB_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: GITHUB_CREDENTIAL_ENCRYPTION_KEY
            # Google 로그인. 돌아올 주소는 Google OAuth 클라이언트에 등록한 값과 글자 하나까지 같아야 한다(개발 서버와 같은 클라이언트·주소).
            # 클라이언트 ID는 비밀값이 아니지만 원본을 SSM 한 곳에 두려고 비밀값과 함께 Secret으로 받는다.
            - name: GOOGLE_LOGIN_ENABLED
              value: "true"
            - name: GOOGLE_REDIRECT_URI
              value: https://catchu.dev/google/callback
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catchu-api
                  key: GOOGLE_CLIENT_SECRET
            # 파일 저장(PDF 올리기·발행 사본, 탈퇴·발행본 삭제가 회원 파일을 지운다). 값이 없으면 api는 뜨지만 이 기능들이 500으로 끝난다.
            # Pod의 빈 볼륨에 두면 Pod가 바뀔 때마다 모든 회원의 파일이 없어지므로 S3 버킷(scripts/create-s3.sh)에 둔다.
            # 버킷 이름은 cluster.yaml의 역할 정책·worker.yaml과 같아야 한다. 지역은 AWS SDK가 읽는 값이다.
            - name: FILE_STORAGE_DRIVER
              value: s3
            - name: FILE_STORAGE_S3_BUCKET
              value: catchu-prod-files
            - name: AWS_REGION
              value: ap-northeast-2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
              ephemeral-storage: 256Mi
          # /health는 DB를 보지 않는 고정 응답이라, DB 장애로 api가 다시 시작되지는 않는다.
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /run/catchu
              readOnly: true
            # GitHub 토큰 암호문만 둔다. 루트 파일시스템은 읽기 전용 그대로이고, 쓰는 곳은 /tmp와 이 폴더뿐이다.
            - name: github-credentials
              mountPath: /var/lib/catchu/github-credentials
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-ca
          configMap:
            name: catchu-db
            items:
              - key: ca.pem
                path: db-ca.pem
        - name: github-credentials
          persistentVolumeClaim:
            claimName: github-credentials
