# 공개 진입(#276): ALB 하나. 80은 443으로 보내고, TLS 1.2·1.3만 받는다. /v1/internal은 404, /v1과 Claude MCP OAuth 주소는 api, 그 밖은 web.
# ALB는 Load Balancer Controller(Helm 차트 3.6.2, scripts/install-lb-controller.sh)가 이 파일을 보고 만든다. 적용은 deploy/aws/k8s/README.md 「적용(2단계)」.
# 인증서는 ACM에서 catchu.dev 이름으로 찾고(ARN을 적지 않음), WAF는 이름 catchu-edge(create-waf.sh)로 붙인다.
# 그래서 이 파일에는 계정 번호가 들어가지 않는다. 이름으로 찾으려고 컨트롤러에 WAF 목록 조회 권한을 더했다(cluster.yaml).
# ALB 경로 규칙은 대소문자를 가린다. /v1/INTERNAL 같은 변형은 WAF 규칙이 404로 막는다(waf/rules.json).
# catchu.dev가 아닌 Host(ALB 기본 주소 등)로 온 요청은 컨트롤러 기본 동작인 404를 받는다.
# 삭제 보호를 켜 두므로, 지울 때는 deploy/aws/README.md 「삭제 순서」 B의 2처럼 삭제 보호를 먼저 끈다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catchu
  namespace: catchu
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
    # 유휴 시간 60초를 값으로 고정한다(web의 연결 유지는 65초). 잘못된 이름의 헤더는 버리고, 요청 밀반입(desync) 방어는 기본 수준을 명시한다.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60,routing.http.drop_invalid_header_fields.enabled=true,routing.http.desync_mitigation_mode=defensive,deletion_protection.enabled=true
    # 앞단 HSTS(2026-10-07 결정: 5분부터 단계적으로). 앱이 붙인 같은 헤더를 이 값 하나로 바꾼다. 개발 서버 Caddy와 같은 값이다.
    alb.ingress.kubernetes.io/listener-attributes.HTTPS-443: routing.http.response.strict_transport_security.header_value=max-age=300
    alb.ingress.kubernetes.io/wafv2-acl-name: catchu-edge
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/tags: project=catchu,issue=276
    alb.ingress.kubernetes.io/actions.internal-not-found: >-
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"404","messageBody":"Not Found"}}
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - catchu.dev
  rules:
    - host: catchu.dev
      http:
        # 컨트롤러는 적힌 순서가 아니라 Exact를 먼저, Prefix는 긴 경로부터 ALB 규칙으로 만든다.
        # 그래서 /v1/internal 404가 /v1보다 앞서고, 아래 OAuth 주소는 /v1·/와 겹치지 않는다.
        paths:
          - path: /v1/internal
            pathType: Prefix
            backend:
              service:
                name: internal-not-found
                port:
                  name: use-annotation
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
          # Claude MCP 연결(#440)의 OAuth 주소. MCP 공식 SDK의 인증 라우터가 api 앱 루트에 만드므로 /v1 밖이지만 api로 보낸다.
          # 목록은 U6 기능 설계를 따르고 개발 서버 Caddyfile의 @mcp_oauth와 같다. /authorize/x·/revoke 같은 주소는 web으로 간다.
          # Exact는 그 주소 하나만, Prefix는 그 주소와 뒤에 /가 붙는 꼴(/.well-known/oauth-protected-resource/v1/mcp 등)을 맞춘다.
          # MCP 주소(/v1/mcp)는 위 /v1 규칙으로 가고, 승인 화면 /profile/claude/authorize는 web 화면이다.
          - path: /authorize
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /token
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /register
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
