# 앱 namespace(#276). 적용 순서와 확인은 deploy/aws/k8s/README.md 「적용(2단계)」.
# Pod 보안 검사 restricted: 호스트 망·특권·root로 도는 Pod를 거부한다. 그래서 모든 Pod 틀에 seccomp·권한 전부 제거·권한 상승 금지를 넣었다.
# ALB 대상 준비 연동: Load Balancer Controller가 있으면 ALB 상태 확인을 통과해야 web·api Pod가 Ready가 된다.
apiVersion: v1
kind: Namespace
metadata:
  name: catchu
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
---
# 앱은 쿠버네티스 API를 쓰지 않는다. 손으로 띄우는 Pod에도 API 토큰이 자동으로 들어가지 않게 한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: catchu
automountServiceAccountToken: false
