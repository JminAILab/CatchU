# 앱 namespace(#276). 적용 순서와 확인은 deploy/aws/k8s/README.md 「적용(2단계)」.
# Pod 보안 검사 restricted: 호스트 망·특권·root로 도는 Pod를 거부한다. 그래서 모든 Pod 틀에 seccomp·권한 전부 제거·권한 상승 금지를 넣었다.
# ALB 대상 준비 연동: Load Balancer Controller가 있으면 ALB 상태 확인을 통과해야 web·api Pod가 Ready가 된다.
apiVersion: v1
kind: Namespace
metadata:
  name: catchu
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
---
# 앱은 쿠버네티스 API를 쓰지 않는다. 손으로 띄우는 Pod에도 API 토큰이 자동으로 들어가지 않게 한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: catchu
automountServiceAccountToken: false
---
# api·worker의 서비스 계정. 회원 파일 버킷(S3)의 서비스별 AWS 역할을 이 이름에 붙인다(cluster.yaml의 Pod Identity 연결).
# 쿠버네티스 API 토큰은 여기서도 탑재하지 않는다. 역할을 받는 데 쓰는 토큰은 EKS가 Pod에 따로 넣으며 쿠버네티스 API에는 쓸 수 없다.
# web·migration·일회 Pod는 default 서비스 계정을 써서 AWS 권한이 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: catchu
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: catchu
automountServiceAccountToken: false
