# api의 GitHub 토큰 보관 폴더(#276). scripts/create-efs.sh가 만든 EFS 파일 시스템을 접근점으로 붙이는 PersistentVolume과 그 요청이다.
# 손으로 적용한다. 밑줄 두 개로 감싼 자리(파일 시스템 ID·접근점 ID)를 조회한 값으로 채워서 쓴다(deploy/aws/features.md 「GitHub 토큰 보관 볼륨」).
# 이 파일을 그대로 kubectl apply하면 라벨 값이 형식에 맞지 않아 둘 다 거부된다(틀린 볼륨 주소로 만들어지지 않게. 볼륨 주소는 만든 뒤 고칠 수 없다).
# - 접근점이 사용자 번호 1000과 시작 폴더 /github-credentials(0700)를 고정하므로 api(UID 1000)만 읽고 쓴다. Pod에는 fsGroup을 두지 않는다.
# - 전송 구간은 TLS다(encryptInTransit). 파일 시스템 정책이 접근점을 거치지 않은 마운트와 TLS가 아닌 접속을 거부한다.
# - 미리 만든 접근점을 쓰는 정적 방식이다. 요청의 storageClassName을 빈 값으로 두어 다른 볼륨이 자동으로 만들어지거나 묶이지 않게 하고,
#   볼륨과 요청이 서로를 이름으로 지정한다(볼륨 쪽 storageClassName은 적지 않으면 빈 값이다).
# - 지워도 EFS의 파일은 남는다(Retain). 용량 값은 쿠버네티스가 요구하는 자리일 뿐 EFS는 쓰지 않는다.
# - api는 한 개만 뜨므로(Recreate) ReadWriteOnce다. 마운트는 노드의 드라이버가 하므로 NetworkPolicy에 2049를 열지 않는다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: catchu-github-credentials
  labels:
    app.kubernetes.io/part-of: catchu
    catchu.io/efs-file-system: __EFS_FILE_SYSTEM__
    catchu.io/efs-access-point: __EFS_ACCESS_POINT__
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: catchu
    name: github-credentials
  csi:
    driver: efs.csi.aws.com
    volumeHandle: "__EFS_FILE_SYSTEM__::__EFS_ACCESS_POINT__"
    volumeAttributes:
      encryptInTransit: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: github-credentials
  namespace: catchu
  labels:
    app.kubernetes.io/part-of: catchu
    catchu.io/efs-file-system: __EFS_FILE_SYSTEM__
    catchu.io/efs-access-point: __EFS_ACCESS_POINT__
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: catchu-github-credentials
  resources:
    requests:
      storage: 1Gi
