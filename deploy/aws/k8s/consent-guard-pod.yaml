# 동의 기록 삭제 권한 확인 일회 Pod 틀(#276). deploy.sh만 쓴다. migration 뒤마다 띄워, 앱 계정(catchu_app)이 동의 기록(analysis_consent)을
# 직접 지울 권한(DELETE·TRUNCATE)이 있는지 보고 → 있으면 회수하고 → 다시 본다. 다시 볼 때도 남아 있으면 실패로 끝나 deploy.sh가 새 실행 전에 멈춘다.
# 기본 권한(deploy/aws/db/roles.sql)이 migration이 새로 만드는 표마다 앱 계정에 DELETE를 주기 때문이다.
# 다른 틀처럼 배포할 커밋의 판을 읽는다. SQL의 표 이름·앱 계정 이름이 그 커밋의 migration·api 설정과 어긋나지 않게 하려는 것이다.
# 밑줄 두 개로 감싼 자리(Pod 이름 catchu-consent-guard-<UTC 시각>·커밋)를 채워 kubectl create한다. 끝난 Pod는 지우지 않고 기록으로 남긴다.
# DB에는 표 소유자인 migration 계정(catchu_migrator)으로 TLS·인증서 검증을 거쳐 붙는다. 비밀번호는 migration과 같은 Secret에서 받으므로
# deploy.sh는 비밀값을 다루지 않는다. 연결 허용은 migration과 같다(NetworkPolicy migration: DB 5432로만 나감). 다만 controller 없는
# 일회 Pod라 정책이 확실히 걸린다고 보지는 않는다(network-policy.yaml 머리말).
# 이미지는 DB 관리 Pod(ops/db-admin-pod.yaml)와 같은 postgres 16.15 digest다. 앱 이미지에는 psql이 없다.
apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
  namespace: catchu
  labels:
    app.kubernetes.io/name: migration
    app.kubernetes.io/component: consent-guard
    app.kubernetes.io/part-of: catchu
  annotations:
    catchu.io/source-revision: __COMMIT__
spec:
  restartPolicy: Never
  # 노드에서 시작한 뒤(이미지 받기 포함) 5분이 지나도 끝나지 않으면 실패로 끝낸다.
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: psql
      image: docker.io/pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
      # psqlrc를 읽지 않고, 오류에서 멈추며 한 트랜잭션으로 실행한다. 다시 볼 때 권한이 남아 있으면 예외로 앞의 회수까지 되돌리고 0이 아닌 코드로 끝난다.
      # 확인 대상은 실제로 쓸 수 있는 권한(has_table_privilege)이라 PUBLIC이나 다른 역할에서 물려받은 권한도 '있음'이다. 회수는 앱 계정에 직접
      # 준 것만 지우므로, 그런 권한이면 다시 볼 때 남아 멈춘다.
      # 한계: 물려받지 않고 SET ROLE로만 바꿔 탈 수 있는 역할(PostgreSQL 16의 INHERIT FALSE 부여)의 권한은 잡지 못한다. roles.sql은 앱 계정에
      # 어떤 역할도 주지 않는다. 앱 계정에 역할을 줄 일이 생기면 이 확인부터 다시 본다.
      # 쿠버네티스는 command의 $(이름)을 환경변수로 바꾸고 $$를 $ 하나로 줄이므로 SQL의 달러 따옴표는 이름을 붙여 쓴다($guard$).
      command:
        - psql
        - --no-psqlrc
        - --quiet
        - --single-transaction
        - --set
        - ON_ERROR_STOP=1
        - --set
        - VERBOSITY=terse
        - --set
        - SHOW_CONTEXT=never
        - --command
        - |
          DO $guard$
          DECLARE
            before_revoke boolean := has_table_privilege('catchu_app', 'public.analysis_consent', 'DELETE, TRUNCATE');
          BEGIN
            IF before_revoke THEN
              REVOKE DELETE, TRUNCATE ON TABLE public.analysis_consent FROM catchu_app;
            END IF;
            IF has_table_privilege('catchu_app', 'public.analysis_consent', 'DELETE, TRUNCATE') THEN
              RAISE EXCEPTION '동의 기록 직접 삭제 권한(catchu_app)이 회수 뒤에도 남아 있다(회수 전 %). PUBLIC이나 다른 역할에서 받은 권한인지 본다',
                CASE WHEN before_revoke THEN '있음' ELSE '없음' END;
            END IF;
            RAISE NOTICE '동의 기록 직접 삭제 권한(catchu_app): 회수 전 %, 회수 뒤 없음', CASE WHEN before_revoke THEN '있음' ELSE '없음' END;
          END
          $guard$;
      env:
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: catchu-db
              key: DB_HOST
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: catchu
        - name: PGUSER
          value: catchu_migrator
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: catchu-migration
              key: DB_PASSWORD
        # psql(libpq)은 PGSSLROOTCERT로 루트 인증서를 읽는다. 인증서와 호스트 이름을 검증한다.
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /run/catchu/db-ca.pem
        - name: PGCONNECT_TIMEOUT
          value: "10"
        - name: PGAPPNAME
          value: catchu-consent-guard
        - name: HOME
          value: /tmp
        - name: PSQL_HISTORY
          value: /dev/null
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
          ephemeral-storage: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: db-ca
          mountPath: /run/catchu
          readOnly: true
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
    - name: db-ca
      configMap:
        name: catchu-db
        items:
          - key: ca.pem
            path: db-ca.pem
