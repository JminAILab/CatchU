# DB 관리용 psql 일회 Pod 틀(#276, 계획 Dv1). db-admin.sh만 쓴다. 밑줄 두 개로 감싼 자리(__NAME__·__RUN__)를 Pod 이름과 실행 표식으로 채워 만든다.
# 같은 이름의 ConfigMap(DB 주소·관리자 이름·SQL·루트 인증서)과 임시 Secret(RDS 관리자 비밀번호·두 계정 비밀번호)을 읽는다.
# 이미지는 로컬 합성 DB(deploy/compose.local-db.yaml)와 같은 postgres 16.15 digest다. 앱 이미지에는 psql이 없다.
# controller 없이 한 번 실행하고(restartPolicy Never) 5분 한도가 있다. 끝나면 db-admin.sh가 Pod·Secret·ConfigMap을 지운다.
apiVersion: v1
kind: Pod
metadata:
  name: __NAME__
  namespace: catchu-ops
  labels:
    app.kubernetes.io/name: db-admin
    app.kubernetes.io/part-of: catchu
    catchu.io/db-admin: once
    catchu.io/db-admin-run: "__RUN__" # 실행마다 새 난수. db-admin.sh가 정리할 때 이 값으로 찾는다
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: psql
      image: docker.io/pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
      # psqlrc를 읽지 않고, 문장을 출력에 되풀이하지 않으며(-a·-e 없음), 실패하면 멈추고 한 트랜잭션 전체를 되돌린다.
      # 오류 때도 문장 원문을 찍지 않는다(VERBOSITY terse). 기본값은 위치 오류에 문장 줄을 그대로 보여 줘 비밀번호가 로그에 남는다.
      command: ["psql", "--no-psqlrc", "--quiet", "--single-transaction", "--set", "ON_ERROR_STOP=1", "--set", "VERBOSITY=terse",
        "--set", "SHOW_CONTEXT=never", "--file", "/run/db-admin/run.sql"]
      env:
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: __NAME__
              key: PGHOST
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: catchu
        - name: PGUSER
          valueFrom:
            configMapKeyRef:
              name: __NAME__
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: __NAME__
              key: PGPASSWORD
        - name: CATCHU_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __NAME__
              key: CATCHU_APP_PASSWORD
        - name: CATCHU_MIGRATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __NAME__
              key: CATCHU_MIGRATOR_PASSWORD
        # psql(libpq)은 PGSSLROOTCERT로 루트 인증서를 읽는다(api의 NODE_EXTRA_CA_CERTS와 다르다). 인증서와 호스트 이름을 검증한다.
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /run/db-admin/db-ca.pem
        - name: PGCONNECT_TIMEOUT
          value: "10"
        - name: PGAPPNAME
          value: catchu-db-admin
        - name: HOME
          value: /tmp
        - name: PSQL_HISTORY
          value: /dev/null
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
          ephemeral-storage: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: files
          mountPath: /run/db-admin
          readOnly: true
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
    - name: files
      configMap:
        name: __NAME__
        items:
          - key: run.sql
            path: run.sql
          - key: ca.pem
            path: db-ca.pem
