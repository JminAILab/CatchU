    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: docker.io/pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
      command: ["sh", "-c", "echo '거부되지 않고 붙었다:'; ls -la /mnt/efs; exit 1"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
