# namespace catchu-ops의 연결 허용 목록(#276). 기본은 모두 막고 DNS와 psql Pod의 DB 연결만 연다.
# 대역은 catchu의 network-policy.yaml과 같다(프라이빗 서브넷 192.168.64.0/19·192.168.96.0/19, 클러스터를 만든 뒤 실제 값과 대조한다).
# 한계: controller 없이 만든 Pod에는 정책이 믿을 만하게 걸리지 않을 수 있고, 새 Pod는 정책이 걸리기 전 몇 초 동안 막히지 않는다.
# 그래서 psql Pod는 DB 계정·TLS 검증이라는 다른 선과 함께 쓴다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: catchu-ops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 모든 Pod: 클러스터 DNS(CoreDNS)만
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: catchu-ops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# DB 관리용 psql 일회 Pod: DB 5432(프라이빗 서브넷)로만 나간다. 들어오는 연결은 없다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-admin
  namespace: catchu-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: db-admin
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.64.0/19
        - ipBlock:
            cidr: 192.168.96.0/19
      ports:
        - protocol: TCP
          port: 5432
