# 로그 수집 확인 일회 Pod(#276 2단계, README.md 「확인」). namespace catchu에서 표식이 든 줄 세 개를 찍고 끝난다.
# 보통 줄 하나는 CloudWatch에 와야 하고, 가짜 토큰이 든 두 줄(Bearer 값·공유 링크 주소)은 수집기가 버려 오지 않아야 한다.
# 표식은 실행 시각으로 매번 바뀐다. 확인한 뒤 Pod를 지운다(지우기 전까지 노드에 로그 파일이 남는다).
apiVersion: v1
kind: Pod
metadata:
  name: log-check
  namespace: catchu
  labels:
    app.kubernetes.io/name: log-check
    app.kubernetes.io/part-of: catchu
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: log-check
      image: public.ecr.aws/docker/library/busybox:1.37.0
      command:
        - sh
        - -c
        - |
          m="CATCHUMARK-$(date +%s)"
          echo "$m keep: log collection check"
          echo "$m drop: Authorization: Bearer FAKEFAKEFAKEFAKEFAKE"
          echo "$m drop: GET /s/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
