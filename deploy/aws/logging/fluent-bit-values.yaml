# 로그 수집기 aws-for-fluent-bit(Helm 차트 0.2.0, 이미지 3.2.1 = Fluent Bit 4.2.2)의 설정값(#276, 2026-10-29 MVP 결정).
# 설치·확인은 README.md. 차트 기본값에서 바꾼 것만 적는다.
# - namespace catchu(web·api·worker·migration)의 컨테이너 로그만 모은다. kube-system·catchu-ops(DB 관리 psql)는 모으지 않는다.
# - 모양을 아는 토큰이 든 줄은 통째로 버린다(아래 additionalFilters). 가리지 않고 버리는 까닭은 일부만 가리면 꼴을 조금 바꾼 값이 빠져나가기 때문이다.
# - 로그 그룹 /catchu/eks/app(보존 14일)은 create-log-group.sh가 미리 만든다. 수집기는 그룹을 만들지 않는다.
# - AWS 권한은 cluster.yaml의 Pod Identity(이 그룹에 로그 스트림 만들기·쓰기만)로 받는다. 호스트 망을 쓰지 않아 노드 권한에 닿지 않는다.

image:
  tag: 3.2.1

input:
  # 컨테이너 로그 파일 이름은 <Pod>_<namespace>_<컨테이너>-<ID>.log다. namespace가 catchu인 것만 맞는다(catchu-ops는 맞지 않는다).
  path: /var/log/containers/*_catchu_*.log

# 쿠버네티스 정보 붙이기(쿠버네티스 API 조회)는 끈다. Pod·컨테이너 이름은 로그 스트림 이름(파일 이름)에 이미 들어 있다.
filter:
  enabled: false

# 토큰이 든 줄 버림. 정규식 하나로 둔다(Exclude를 여러 줄로 나누면 묶는 방식에 따라 결과가 달라진다).
# 버리는 꼴: JWT(Access 토큰 등), Bearer 값, GitHub 토큰(ghp_ 등·github_pat_), Anthropic 키(sk-ant-), Voyage 키(pa-),
# Google 클라이언트 비밀(GOCSPX-), 공유 링크 토큰이 든 주소(/s/·/public/links/ 뒤 43자), 로그인 콜백의 code·state 값.
# DB 비밀번호처럼 꼴이 정해지지 않은 값은 잡지 못한다. 앱이 값을 로그에 쓰지 않는 것이 먼저다(코딩 절차 「자료와 실행 로그」).
# 바꾸면 logs.test.sh로 실제 Fluent Bit에서 시험한다.
additionalFilters: |
  [FILTER]
      Name    grep
      Match   kube.*
      Exclude log (eyJ[A-Za-z0-9_-]{8,}\.eyJ|[Bb]earer\s+[A-Za-z0-9._~+/=-]{8,}|gh[opusr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{8,}|\bpa-[A-Za-z0-9_-]{30,}|GOCSPX-[A-Za-z0-9_-]{8,}|/(s|public/links)/[A-Za-z0-9_-]{43}|[?&](code|state)=[^&\s]{8,})

cloudWatchLogs:
  region: ap-northeast-2
  logGroupName: /catchu/eks/app
  # 스트림 이름은 app-kube.var.log.containers.<파일 이름>이 된다.
  logStreamPrefix: app-
  # 로그 줄 원문만 보낸다(수집기가 붙이는 시각·stdout 표시 등은 보내지 않는다).
  logKey: log
  # false면 차트가 auto_create_group 줄을 쓰지 않고 플러그인 기본값(false)이 쓰인다.
  autoCreateGroup: false

serviceAccount:
  # cluster.yaml의 Pod Identity 연결과 같은 이름.
  name: aws-for-fluent-bit

# containerd 노드에는 /var/lib/docker/containers가 없어 /var/log만 붙인다.
volumes:
  - name: varlog
    hostPath:
      path: /var/log
volumeMounts:
  - name: varlog
    mountPath: /var/log
