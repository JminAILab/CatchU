# 단일 호스트 실행 구성(#275): API 한 프로세스·worker 한 실행·web 하나. 사용법은 deploy/README.md.
# 같은 운영 DB·큐에 이 구성과 EKS 실행을 동시에 연결하지 않는다.
# migration은 profile로 분리해 `up`에 들어가지 않는다. 앱이 migration을 기다리거나 대신 실행하지도 않는다.
# 값은 `docker compose --env-file <실행 묶음 파일>`로 받는다. 비밀값은 저장소 밖 환경 폴더의 파일로만 주입한다.
name: ${CATCHU_SINGLE_NAME:-catchu-single}

# 쓰기 경로는 /tmp(tmpfs)뿐이다. 세 이미지가 읽기 전용 파일시스템·권한 제거 상태에서 동작하는 것을 검사로 확인했다.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"

# DB TLS 신뢰 CA. pg는 PGSSLROOTCERT를 읽지 않으므로 NODE_EXTRA_CA_CERTS로 넣는다. 파일이 없으면 시작하지 않는다.
x-db-ca: &db-ca
  type: bind
  source: ${CATCHU_DB_CA_FILE:?DB 서버 인증서를 발급한 CA 파일 경로(CATCHU_DB_CA_FILE)가 필요합니다}
  target: /run/catchu/db-ca.pem
  read_only: true
  bind:
    create_host_path: false

# env 파일에 NODE_TLS_REJECT_UNAUTHORIZED=0을 넣어도 인증서 검증이 꺼지지 않게 기본값(1)을 고정한다.
x-db-tls: &db-tls
  PGSSLMODE: verify-full
  NODE_EXTRA_CA_CERTS: /run/catchu/db-ca.pem
  NODE_TLS_REJECT_UNAUTHORIZED: "1"

services:
  api:
    <<: *hardening
    image: ${CATCHU_API_IMAGE:?api 이미지(CATCHU_API_IMAGE)가 필요합니다}
    # 이름을 고정해 같은 호스트에서 api를 둘 띄우거나 --scale로 늘릴 수 없게 한다.
    container_name: ${CATCHU_SINGLE_NAME:-catchu-single}-api
    env_file:
      - path: ${CATCHU_ENV_DIR:?저장소 밖 환경 폴더(CATCHU_ENV_DIR)가 필요합니다}/api.env
        required: true
    # 아래 값은 env 파일보다 우선한다. env 파일로 운영 모드·DB TLS 설정을 바꿀 수 없게 한다(NODE_OPTIONS 같은 값은 넣지 않는다).
    environment:
      <<: *db-tls
      NODE_ENV: production
      BIND_HOST: 0.0.0.0
      PORT: "3001"
    volumes:
      - *db-ca
    ports:
      - "127.0.0.1:${CATCHU_API_PORT:-3001}:3001"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  worker:
    <<: *hardening
    image: ${CATCHU_WORKER_IMAGE:?worker 이미지(CATCHU_WORKER_IMAGE)가 필요합니다}
    container_name: ${CATCHU_SINGLE_NAME:-catchu-single}-worker
    # 현재 worker는 환경변수를 읽지 않는다. 큐·자격정보 설정은 #121·#232 제공 판본에서 더한다.
    ports:
      - "127.0.0.1:${CATCHU_WORKER_PORT:-8000}:8000"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/worker/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s

  web:
    <<: *hardening
    image: ${CATCHU_WEB_IMAGE:?web 이미지(CATCHU_WEB_IMAGE)가 필요합니다}
    container_name: ${CATCHU_SINGLE_NAME:-catchu-single}-web
    ports:
      - "127.0.0.1:${CATCHU_WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s

  # 한 번 실행하고 끝나는 migration. `docker compose --profile migration run`으로만 실행한다(deploy/scripts/replace-single.sh).
  migration:
    <<: *hardening
    image: ${CATCHU_MIGRATION_IMAGE:?migration 이미지(CATCHU_MIGRATION_IMAGE)가 필요합니다}
    profiles:
      - migration
    env_file:
      - path: ${CATCHU_ENV_DIR}/migration.env
        required: true
    environment:
      <<: *db-tls
    volumes:
      - *db-ca
    restart: "no"
